[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-timer-audit"
version = "0.1.5"
description = "Detect systemd timers that cluster right after resume-from-suspend (upstream issue #43350)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "zhuhroscar-tech"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
resume-timer-audit = "resume_timer_audit.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
