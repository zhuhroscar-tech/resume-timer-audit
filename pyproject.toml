[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-timer-audit"
version = "0.1.10"
description = "Detect systemd timers that cluster right after resume-from-suspend (upstream issue #43350)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "zhuhroscar-tech"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/resume-timer-audit"
Issues = "https://github.com/zhuhroscar-tech/resume-timer-audit/issues"
Changelog = "https://github.com/zhuhroscar-tech/resume-timer-audit/blob/main/CHANGELOG.md"

[project.scripts]
resume-timer-audit = "resume_timer_audit.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
